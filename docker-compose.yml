services:
  spring-boot-app:
    container_name: "studam_backend"
    build:
      context: .
    image: studam_backend:latest
    ports:
      - "9026:8080"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=open2021
      - DATABASE_NAME=studam_database
      - DATABASE_SSL_MODE=disable
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_DB: studam_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: open2021
    ports:
      - "5433:5432"
