services:
  spring-boot-app:
    container_name: "studam_backend"
    build:
      context: .
    image: studam_backend:latest
    ports:
      - "9026:8080"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=open2021
      - DATABASE_NAME=studam_database
    depends_on:
      - db

  db:
    image: mysql:latest
    container_name: db
    environment:
      MYSQL_DATABASE: studam_database
      MYSQL_ROOT_PASSWORD: open2021
    ports:
      - "3308:3306"
